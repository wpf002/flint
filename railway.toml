# Railway config for the hosted Flint service (apps/server).
# Build context is the repo root so the Dockerfile can see the whole workspace.

[build]
# No builder key. Railway's Builder enum has no DOCKERFILE value, and an invalid value
# makes Railway discard the whole file. dockerfilePath alone selects the Dockerfile.
dockerfilePath = "apps/server/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
