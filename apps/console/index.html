<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Flint</title>
<!-- Installable app (iPhone home screen / Mac dock) -->
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Flint" />
<meta name="theme-color" content="#050505" />
<style>
  :root{--bg:#050505;--gold:#d4af37;--gold-hi:#f3dd8e;--orange:#ffb14a;--ink:#e8e3d2;--mut:#8d7c54;--line:#19150f;}
  *{box-sizing:border-box;margin:0;font-family:"SF Mono",ui-monospace,Menlo,monospace;}
  html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;}
  #app{display:grid;grid-template-rows:auto 1fr;height:100vh;}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 14px 90px;border-bottom:1px solid var(--line);-webkit-app-region:drag;}
  header button,header .gear{-webkit-app-region:no-drag;}
  .brand{display:flex;align-items:center;gap:11px;cursor:pointer;}
  .brand .sp{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff4cf,var(--orange) 55%,#7a4a10);box-shadow:0 0 16px var(--orange);}
  .brand .nm{color:var(--gold-hi);letter-spacing:.42em;font-size:18px;font-weight:700;}
  header .meta{font-size:11px;color:var(--mut);letter-spacing:.14em;text-align:right;line-height:1.7;}
  header .meta b{color:var(--orange);}
  main{display:flex;min-height:0;position:relative;}
  aside h3{font-size:10px;letter-spacing:.26em;color:#8a7320;text-transform:uppercase;margin-bottom:12px;}
  .sys{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.5px;border-bottom:1px dashed var(--line);}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--gold);box-shadow:0 0 8px var(--gold);}
  .dot.off{background:#3a3a44;box-shadow:none;}
  .center{position:relative;display:flex;flex-direction:column;min-height:0;flex:1;}
  #brainwrap{flex:1;position:relative;min-height:0;}
  #brain{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .think{display:none;}
  aside.chat{width:380px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
  #transcript{flex:1;overflow:auto;padding:16px 20px;}
  aside.chat .bar{margin:12px;}
  .msg{margin:8px 0;font-size:13.5px;line-height:1.5;}
  .msg .who{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:3px;}
  .msg.you .who{color:#7d96b8;} .msg.flint .who{color:var(--gold);}
  .msg.flint{color:#f0e6cf;}
  .log{font-size:11.5px;line-height:1.4;}
  .log .row{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);}
  .log .a{flex:none;color:var(--gold);} .log .a.back{color:#6f9c6a;} .log .a.hold{color:#b9462e;}
  .log .t{margin-left:auto;color:var(--mut);}
  footer{padding:12px 18px 16px;border-top:1px solid var(--line);}
  .bar{display:flex;align-items:center;gap:12px;padding:11px 16px;background:#0c0c12;border:1px solid #1d1d28;border-radius:999px;}
  .bar input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-size:13.5px;letter-spacing:.03em;}
  .bar input::placeholder{color:var(--mut);}
  .bar button{background:transparent;border:1px solid var(--gold-dim,#8a7320);color:var(--gold);border-radius:999px;padding:6px 16px;cursor:pointer;letter-spacing:.1em;font-size:11px;}
  .bar button:hover{border-color:var(--gold);color:var(--gold-hi);}
  .bar .mic{padding:7px 11px;display:flex;align-items:center;}
  .bar .mic svg{display:block;}
  .bar .sendbtn{padding:7px 13px;display:flex;align-items:center;}
  .bar .sendbtn svg{display:block;}
  .bar .mic.rec{background:var(--gold);color:#000;border-color:var(--gold);animation:micpulse 1s ease-in-out infinite;}
  .bar .mic.busy{opacity:.5;}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,.5);}50%{box-shadow:0 0 0 6px rgba(212,175,55,0);}}
  #settings{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9;}
  #settings .card{background:#0d0d12;border:1px solid #222;border-radius:12px;padding:22px;width:360px;}
  #settings h4{color:var(--gold);letter-spacing:.2em;font-size:12px;margin-bottom:14px;text-transform:uppercase;}
  #settings label{display:block;font-size:10px;color:var(--mut);letter-spacing:.14em;margin:12px 0 5px;}
  #settings input{width:100%;background:#08080b;border:1px solid #222;border-radius:7px;color:var(--ink);padding:9px;font-size:12px;}
  #settings .row{display:flex;gap:8px;margin-top:18px;}
  #settings button{flex:1;background:var(--gold);color:#000;border:none;border-radius:7px;padding:9px;cursor:pointer;letter-spacing:.1em;font-weight:600;}
  #settings button.ghost{background:transparent;color:var(--mut);border:1px solid #222;}
  .log .row{cursor:pointer;border-radius:6px;padding:3px 5px;margin:0 -5px;align-items:center;}
  .log .row:hover{background:#140f06;}
  .log .row .cv{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;font-size:11px;}
  #convo{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:10;}
  #convo .card{background:#0d0d12;border:1px solid #222;border-radius:12px;padding:24px;width:min(640px,90vw);max-height:80vh;overflow:auto;}
  #convo h4{color:var(--gold);letter-spacing:.2em;font-size:12px;margin-bottom:8px;text-transform:uppercase;}
  #convo .lbl{font-size:10px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin-top:12px;}
  #convo .q{color:var(--ink);font-size:13px;margin:5px 0 4px;white-space:pre-wrap;line-height:1.5;}
  #convo .ans{color:var(--gold-hi);font-size:13px;white-space:pre-wrap;line-height:1.55;margin-top:5px;}
  #convo button{margin-top:20px;background:var(--gold);color:#000;border:none;border-radius:7px;padding:9px 18px;cursor:pointer;letter-spacing:.1em;font-weight:600;}
  .hdr-right{display:flex;align-items:center;gap:2px;}
  .hicon{background:transparent;border:none;color:var(--mut);cursor:pointer;padding:6px;border-radius:8px;display:flex;align-items:center;}
  .hicon:hover{color:var(--gold);background:#140f06;}
  .hicon svg{display:block;}
  #settings .card{width:min(460px,92vw);max-height:84vh;overflow:auto;}
  #settings .seg{font-size:10px;letter-spacing:.24em;color:#8a7320;text-transform:uppercase;margin:20px 0 6px;border-top:1px solid var(--line);padding-top:16px;}
  #settings .seg:first-of-type{border-top:none;padding-top:0;margin-top:2px;}
  #settings .seg-toggle{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  #settings .seg-toggle:hover{color:var(--gold);}
  #settings .seg-toggle #logcaret{transition:transform .15s;}
  #settings #systems .sys{font-size:12.5px;text-transform:uppercase;letter-spacing:.1em;}
  #settings .log{max-height:46vh;overflow:auto;}
  .msg .body b{color:var(--gold-hi);font-weight:600;} .msg .body code{background:#1a1712;color:var(--gold-hi);padding:1px 5px;border-radius:4px;font-size:12.5px;}
  .msg .body i{color:#e8dcc0;font-style:italic;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="sp"></span><span class="nm">FLINT</span></div>
    <div class="hdr-right">
      <button class="hicon" onclick="newChat()" title="New chat" aria-label="New chat"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      <button class="hicon" onclick="openSettings()" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></button>
    </div>
  </header>
  <main>
    <div class="center">
      <div id="brainwrap"><canvas id="brain"></canvas><div class="think" id="think"></div></div>
    </div>
    <aside class="chat">
      <div id="transcript"></div>
      <div class="bar">
        <input id="input" placeholder="How can I help you?" autocomplete="off" />
        <button class="mic" id="micbtn" onclick="toggleMic()" title="Hold a conversation — speak, and Flint speaks back" aria-label="Speak"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="18.5" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg></button>
        <button class="sendbtn" onclick="send()" title="Send" aria-label="Send"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
      </div>
    </aside>
  </main>
</div>

<div id="settings"><div class="card">
  <h4>Flint — Settings</h4>
  <div class="seg">Systems</div>
  <div id="systems"><div class="sys"><span class="dot off"></span>—</div></div>
  <div class="seg seg-toggle" onclick="toggleLog()"><span>Action Log</span><span id="logcaret">▸</span></div>
  <div class="log" id="log" style="display:none"></div>
  <div class="row"><button onclick="closeSettings()">Close</button></div>
</div></div>

<div id="convo" onclick="if(event.target===this)closeConvo()"><div class="card">
  <h4>Conversation</h4>
  <div class="lbl">You</div><div class="q" id="cv-q"></div>
  <div class="lbl">Flint</div><div class="ans" id="cv-a"></div>
  <button onclick="closeConvo()">Close</button>
</div></div>

<script>
/* ---------- config ---------- */
// Same-origin by default (the app is served BY Flint), and the token is injected
// by the server so the app opens already authenticated — no URL, no sign-in.
var BASE = localStorage.getItem('flint_url') || '';
var TOKEN = localStorage.getItem('flint_token') || (window.__FLINT_TOKEN__ || '');
var convId = 'console';
function newChat(){
  stopSpeech();
  convId = 'c' + Date.now();
  document.getElementById('transcript').innerHTML = '';
  var inp = document.getElementById('input'); inp.value = ''; inp.focus();
}
function openSettings(){document.getElementById('settings').style.display='flex';}
function closeSettings(){document.getElementById('settings').style.display='none';}
function auth(){return TOKEN?{'Authorization':'Bearer '+TOKEN}:{};}

/* ---------- live data ---------- */
function refresh(){
  fetch(BASE+'/health').then(r=>r.json()).then(h=>{
    var sys=document.getElementById('systems');sys.innerHTML='';
    (h.servers||[]).forEach(function(s){sys.innerHTML+='<div class="sys"><span class="dot"></span>'+esc(s)+'</div>';});
    if(!(h.servers||[]).length)sys.innerHTML='<div class="sys"><span class="dot off"></span>No connectors</div>';
  }).catch(function(){});
  pollLog();
}
function md(s){
  s=esc(s);
  s=s.replace(/```([\s\S]*?)```/g,'<code>$1</code>');
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/__([^_]+)__/g,'<b>$1</b>');
  s=s.replace(/^\s{0,3}#{1,6}\s+(.+)$/gm,'<b>$1</b>');
  s=s.replace(/^\s*[*\-•]\s+/gm,'• ');
  s=s.replace(/\n/g,'<br>');
  return s;
}
var CONVOS=[];
function esc(s){return (s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pollLog(){
  if(!TOKEN)return;
  fetch(BASE+'/conversations',{headers:auth()}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d)return;CONVOS=d.conversations||[];
    var log=document.getElementById('log');var rows=CONVOS.slice(-100).reverse();log.innerHTML='';
    if(!rows.length){log.innerHTML='<div class="row" style="cursor:default"><span class="a">·</span><span class="cv">No conversations yet</span></div>';return;}
    rows.forEach(function(e){
      var dt=new Date(e.ts);var hh=('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2);
      var div=document.createElement('div');div.className='row';
      div.innerHTML='<span class="a">✓</span><span>Complete</span><span class="t" style="margin-left:auto">'+hh+'</span>';
      div.onclick=function(){openConvo(e.id);};
      log.appendChild(div);
    });
  }).catch(function(){});
}
function openConvo(id){var c=null;for(var i=0;i<CONVOS.length;i++){if(CONVOS[i].id===id)c=CONVOS[i];}
  if(!c)return;
  document.getElementById('cv-q').textContent=c.question;
  document.getElementById('cv-a').innerHTML=md(c.answer||'(no text captured)');
  document.getElementById('convo').style.display='flex';}
function closeConvo(){document.getElementById('convo').style.display='none';}
function toggleLog(){var l=document.getElementById('log'),c=document.getElementById('logcaret');
  var open=l.style.display!=='none';l.style.display=open?'none':'block';c.textContent=open?'▸':'▾';}
setInterval(refresh,5000);

/* ---------- chat (SSE) ---------- */
function addMsg(who,cls){var t=document.getElementById('transcript');var d=document.createElement('div');d.className='msg '+cls;
  d.innerHTML='<span class="who">'+who+'</span><span class="body"></span>';t.appendChild(d);t.scrollTop=t.scrollHeight;return d.querySelector('.body');}
function send(speakBack){
  var sb=speakBack===true;
  var inp=document.getElementById('input');var msg=inp.value.trim();if(!msg)return;inp.value='';
  if(!TOKEN){openSettings();return;}
  addMsg('You','you').textContent=msg;
  var body=addMsg('Flint','flint');var raw='',spoken=0;if(sb)stopSpeech();var vctx={displayed:'',gen:_ttsGen};document.getElementById('think').textContent='responding';setTalk(1);
  fetch(BASE+'/chat',{method:'POST',headers:Object.assign({'content-type':'application/json'},auth()),body:JSON.stringify({conversationId:convId,message:msg})})
  .then(function(res){
    if(res.status===401){body.textContent='[unauthorized — set your token]';openSettings();return;}
    var reader=res.body.getReader(),dec=new TextDecoder(),buf='';
    function pump(){return reader.read().then(function(r){
      if(r.done){document.getElementById('think').textContent='';setTalk(0);pollLog();if(sb){var tail=raw.slice(spoken);if(tail.trim())speakSynced(tail,body,vctx);}return;}
      buf+=dec.decode(r.value,{stream:true});var parts=buf.split('\n\n');buf=parts.pop();
      parts.forEach(function(p){var m=p.match(/^data: (.*)$/m);if(!m)return;try{var ev=JSON.parse(m[1]);
        if(ev.type==='text'){raw+=ev.delta;setTalk(1);
          if(!sb){body.innerHTML=md(raw);document.getElementById('transcript').scrollTop=9e9;}
          else{var rest=raw.slice(spoken),re=/[.!?](\s|$)/g,mm,last=-1;while((mm=re.exec(rest))){last=mm.index+1;}if(last>0){speakSynced(rest.slice(0,last),body,vctx);spoken+=last;}}}
        if(ev.type==='error'){var em=' [error: '+(ev.error&&ev.error.kind||ev.error)+']';raw+=em;if(sb){vctx.displayed+=em;body.innerHTML=md(vctx.displayed);}else{body.innerHTML=md(raw);}}
      }catch(e){}});
      return pump();
    });}
    return pump();
  }).catch(function(e){body.textContent='[connection failed]';document.getElementById('think').textContent='';setTalk(0);});
}
document.getElementById('input').addEventListener('keydown',function(e){if(e.key==='Enter')send();});

/* ---------- voice (speak to Flint, Flint speaks back) ---------- */
var mediaRec=null,voChunks=[],_flintVoice=null;
function pickVoice(){
  if(_flintVoice)return _flintVoice;
  var vs=(window.speechSynthesis&&window.speechSynthesis.getVoices())||[];
  var prefer=['Aaron','Daniel','Fred','Alex','Tom','Oliver','Arthur','Reed','Gordon','Rishi'];
  for(var i=0;i<prefer.length;i++)for(var j=0;j<vs.length;j++)if(vs[j].name.indexOf(prefer[i])>=0){_flintVoice=vs[j];return _flintVoice;}
  for(var k=0;k<vs.length;k++)if(/^en/i.test(vs[k].lang)&&/male|man/i.test(vs[k].name)){_flintVoice=vs[k];return _flintVoice;}
  for(var l=0;l<vs.length;l++)if(/^en/i.test(vs[l].lang)){_flintVoice=vs[l];return _flintVoice;}
  return null;
}
if(window.speechSynthesis)window.speechSynthesis.onvoiceschanged=function(){_flintVoice=null;pickVoice();};
// Speech output: prefer the server's neural voice (human); fall back to the
// local browser voice. Sentences are chained so they always play in order.
var _ttsChain=Promise.resolve(),_ttsGen=0,_ttsAudio=null;
function stopSpeech(){_ttsGen++;_ttsChain=Promise.resolve();try{if(_ttsAudio){_ttsAudio.pause();_ttsAudio=null;}}catch(e){}try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(e){}}
function _localSpeak(clean){return new Promise(function(res){try{var u=new SpeechSynthesisUtterance(clean);var v=pickVoice();if(v)u.voice=v;u.rate=1.05;u.pitch=0.92;u.onend=u.onerror=function(){res();};window.speechSynthesis.speak(u);}catch(e){res();}});}
function _neuralFetch(clean){return fetch(BASE+'/speak',{method:'POST',headers:Object.assign({'content-type':'application/json'},auth()),body:JSON.stringify({text:clean})}).then(function(r){if(!r.ok)throw new Error('no-tts');return r.blob();});}
// Speak a sentence AND reveal its text in sync — the words appear on screen the
// instant Flint starts saying them. Audio for the next sentence is prefetched
// while the current one plays, so there are no gaps. Sentences play in order.
function speakForVoice(s){
  // The on-screen text keeps symbols (97°F); the SPOKEN text expands them so the
  // voice actually says the words.
  return s.replace(/[*_`#>\[\]]/g,'')
    .replace(/(\d)\s*°\s*F\b/g,'$1 degrees Fahrenheit')
    .replace(/(\d)\s*°\s*C\b/g,'$1 degrees Celsius')
    .replace(/°/g,' degrees')
    .replace(/\bmph\b/gi,' miles per hour')
    .replace(/(\d)\s*%/g,'$1 percent')
    .replace(/\bRealFeel\b/gi,'real feel')
    .replace(/\s+/g,' ').trim();
}
function speakSynced(sentence,body,vctx){
  var clean=speakForVoice(sentence);
  var reveal=function(){vctx.displayed+=sentence;body.innerHTML=md(vctx.displayed);var tr=document.getElementById('transcript');if(tr)tr.scrollTop=9e9;};
  var blobP=clean?_neuralFetch(clean).catch(function(){return null;}):Promise.resolve(null); // fetch NOW (parallel prefetch)
  _ttsChain=_ttsChain.then(function(){
    if(vctx.gen!==_ttsGen)return;
    return blobP.then(function(blob){
      return new Promise(function(res){
        if(vctx.gen!==_ttsGen){res();return;}
        if(blob){
          var url=URL.createObjectURL(blob);var a=new Audio(url);_ttsAudio=a;
          a.onplay=reveal; // text shows up exactly as the voice begins it
          a.onended=a.onerror=function(){URL.revokeObjectURL(url);if(_ttsAudio===a)_ttsAudio=null;res();};
          a.play().catch(function(){reveal();res();});
        }else{reveal();_localSpeak(clean).then(res);} // no neural voice → local, still synced
      });
    });
  });
}
function toggleMic(){
  var btn=document.getElementById('micbtn');
  if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return;}
  if(!navigator.mediaDevices||!window.MediaRecorder){alert('Voice input is not available in this view.');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    voChunks=[];try{mediaRec=new MediaRecorder(stream);}catch(e){mediaRec=new MediaRecorder(stream,{mimeType:'audio/mp4'});}
    btn.classList.add('rec');
    mediaRec.ondataavailable=function(e){if(e.data&&e.data.size)voChunks.push(e.data);};
    mediaRec.onstop=function(){
      btn.classList.remove('rec');stream.getTracks().forEach(function(t){t.stop();});
      if(!voChunks.length)return;
      var blob=new Blob(voChunks,{type:voChunks[0].type||'audio/mp4'});
      btn.classList.add('busy');
      fetch(BASE+'/transcribe',{method:'POST',headers:auth(),body:blob}).then(function(r){return r.json();}).then(function(d){
        btn.classList.remove('busy');
        if(d&&d.text){document.getElementById('input').value=d.text;send(true);}
      }).catch(function(){btn.classList.remove('busy');});
    };
    mediaRec.start();
  }).catch(function(e){alert('Microphone access is needed for voice: '+(e.message||e));});
}

/* ---------- the brain (approved viz) ---------- */
var talkTarget=0,talkNow=0;function setTalk(v){talkTarget=v;}
(function(){
  var cvs=document.getElementById('brain'),ctx=cvs.getContext('2d'),W,H,DPR,cx,cy,R;
  function size(){DPR=Math.min(window.devicePixelRatio||1,2);var r=cvs.getBoundingClientRect();W=r.width;H=r.height;cvs.width=W*DPR;cvs.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);cx=W/2;cy=H/2;R=Math.min(W,H)*0.20;}
  size();window.addEventListener('resize',size);
  // Refit whenever the canvas box changes size — e.g. the transcript growing
  // underneath shrinks the brain area; without this the viz gets clipped.
  if(window.ResizeObserver){new ResizeObserver(function(){size();}).observe(cvs);}
  var N=520,P=[];for(var i=0;i<N;i++){var u=Math.random(),v=Math.random(),th=2*Math.PI*u,ph=Math.acos(2*v-1),shell=0.55+Math.random()*0.6;
    P.push({sx:Math.sin(ph)*Math.cos(th),sy:Math.cos(ph),sz:Math.sin(ph)*Math.sin(th),rad:shell,sp:0.4+Math.random()*0.9,ph0:Math.random()*6.28,sz2:0.5+Math.random()*1.4});}
  for(var a=0;a<N;a++){var best=[1e9,1e9],bi=[-1,-1],pa=P[a];for(var b=0;b<N;b++){if(b===a)continue;var pb=P[b];var d=(pa.sx-pb.sx)*(pa.sx-pb.sx)+(pa.sy-pb.sy)*(pa.sy-pb.sy)+(pa.sz-pb.sz)*(pa.sz-pb.sz);if(d<best[0]){best[1]=best[0];bi[1]=bi[0];best[0]=d;bi[0]=b;}else if(d<best[1]){best[1]=d;bi[1]=b;}}pa.n=bi;}
  var flares=[],t0=performance.now();
  function rot(p,ay,ax){var x=p.sx*p.rad,y=p.sy*p.rad,z=p.sz*p.rad;var cy1=Math.cos(ay),sy1=Math.sin(ay),x1=x*cy1-z*sy1,z1=x*sy1+z*cy1;var cx1=Math.cos(ax),sx1=Math.sin(ax),y1=y*cx1-z1*sx1,z2=y*sx1+z1*cx1;var fov=2.6,sc=fov/(fov+z2);return{X:cx+x1*R*sc,Y:cy+y1*R*sc,z:z2};}
  function frame(now){var t=(now-t0)/1000;
    talkNow+=(talkTarget-talkNow)*0.08;
    var talk=talkNow*( (Math.sin(t*7)*0.5+0.5)*(Math.sin(t*13)*0.5+0.5) );
    var breath=0.5+0.5*Math.sin(t*1.3),amp=0.22*breath+0.9*talk,ay=t*0.34,ax=Math.sin(t*0.22)*0.5+0.3,pr=R*(1+amp*0.10);
    ctx.clearRect(0,0,W,H);var gg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*3.2);gg.addColorStop(0,'rgba(255,150,40,'+(0.10+amp*0.10)+')');gg.addColorStop(0.5,'rgba(120,60,10,0.04)');gg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='lighter';
    var pj=new Array(N);for(var i=0;i<N;i++){var p=P[i];var wob=1+0.06*Math.sin(t*p.sp+p.ph0)+amp*0.05;pj[i]=rot({sx:p.sx,sy:p.sy,sz:p.sz,rad:p.rad*wob},ay+p.sz*0.15,ax);}
    ctx.lineWidth=0.6;for(var i=0;i<N;i++){var pa=pj[i],p=P[i];for(var k=0;k<2;k++){var j=p.n[k];if(j<0)continue;var pb=pj[j];var fl=0.05+0.08*amp+0.04*Math.sin(t*4+i);ctx.strokeStyle='rgba(255,165,60,'+Math.max(0,fl)+')';ctx.beginPath();ctx.moveTo(pa.X,pa.Y);ctx.lineTo(pb.X,pb.Y);ctx.stroke();}}
    for(var i=0;i<N;i++){var q=pj[i],p=P[i];var depth=(q.z+1.4)/2.8,rr=(0.9+1.7*depth)*p.sz2*(0.85+amp*0.5),br=0.35+0.65*depth,inner=p.rad<0.8,col=inner?'255,238,170':'255,'+Math.round(150+60*depth)+','+Math.round(40+20*depth);var g=ctx.createRadialGradient(q.X,q.Y,0,q.X,q.Y,rr*3.2);g.addColorStop(0,'rgba('+col+','+br+')');g.addColorStop(1,'rgba('+col+',0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.X,q.Y,rr*3.2,0,6.283);ctx.fill();}
    var core=ctx.createRadialGradient(cx,cy,0,cx,cy,pr*0.7);core.addColorStop(0,'rgba(255,250,225,0.9)');core.addColorStop(0.25,'rgba(255,200,110,0.8)');core.addColorStop(0.6,'rgba(220,120,30,0.25)');core.addColorStop(1,'rgba(120,60,10,0)');ctx.fillStyle=core;ctx.beginPath();ctx.arc(cx,cy,pr*0.7,0,6.283);ctx.fill();
    if(talk>0.15){ctx.strokeStyle='rgba(255,180,70,'+(talk*0.5)+')';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(cx,cy,R*(1.05+talk*0.4),0,6.283);ctx.stroke();}
    if(Math.random()<0.04)flares.push({a:Math.random()*6.283,r:R*0.45,life:1});
    for(var f=flares.length-1;f>=0;f--){var fo=flares[f];fo.r+=1.5;fo.life-=0.03;if(fo.r>R*1.35)fo.life=0;if(fo.life<=0){flares.splice(f,1);continue;}var fx=cx+Math.cos(fo.a)*fo.r,fy=cy+Math.sin(fo.a)*fo.r;var fgr=ctx.createRadialGradient(fx,fy,0,fx,fy,7);fgr.addColorStop(0,'rgba(255,210,120,'+(fo.life*0.6)+')');fgr.addColorStop(1,'rgba(255,150,40,0)');ctx.fillStyle=fgr;ctx.beginPath();ctx.arc(fx,fy,7,0,6.283);ctx.fill();}
    ctx.globalCompositeOperation='source-over';
    document.getElementById('think').textContent = talkNow>0.3?'responding':'';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

refresh();
if(!TOKEN) setTimeout(openSettings,400);
</script>
