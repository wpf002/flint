<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<title>Flint</title>
<!-- Installable app (iPhone home screen / Mac dock) -->
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Flint" />
<meta name="theme-color" content="#050505" />
<style>
  /* Flint's black and gold (the approved direction, 2026-10-05): its #050505 black, warm
     near-black surfaces, warm ink, gold for the primary action, badges, focus, the small
     UPPERCASE headers, the mark and the orb. One type family: the system's (San Francisco). */
  :root{
    --bg:#050505;--s0:#0b0a07;--s1:#12100c;--s2:#1a1712;--s3:#221e17;--s4:#2b261d;
    --bd:#3a3326;--bd2:#4a4231;
    --t1:#e8e3d2;--t2:#b8ad94;--t3:#958b74;--tdis:#6f6754;
    --gold:#d4af37;--gold-hi:#f3dd8e;--on-gold:#0a0a0a;--orange:#ff9230;--red:#ff4245;--green:#30d158;
    --ring:rgba(243,221,142,.16);--hair:rgba(232,227,210,.10);--hair2:rgba(232,227,210,.18);--user:rgba(232,227,210,.07);--code:rgba(232,227,210,.08);--scrim:rgba(0,0,0,.6);
    --shadow:0 0 0 1px var(--ring),0 1px 1px rgba(0,0,0,.2),0 8px 16px -4px rgba(0,0,0,.4),0 24px 32px -8px rgba(0,0,0,.5);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace;
    --side:260px;--hdr:52px;
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;}
  html,body{height:100%;background:var(--bg);color:var(--t1);overflow:hidden;font:13px/18px var(--sans);-webkit-font-smoothing:antialiased;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  button:disabled{cursor:default;opacity:.5;}
  input,textarea{font:inherit;color:inherit;}
  :focus-visible{outline:none;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold-hi);border-radius:6px;}
  [hidden]{display:none!important;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
  svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block;}

  /* ---------- the window: sidebar | (header over) orb stage + chat ---------- */
  #app{display:grid;grid-template-columns:0 minmax(0,1fr);height:100vh;height:100dvh;}
  #app.side-open{grid-template-columns:var(--side) minmax(0,1fr);}
  .main{grid-column:2;position:relative;display:grid;grid-template-columns:minmax(0,clamp(320px,50%,680px)) minmax(0,1fr);min-width:0;min-height:0;}
  #app.side-open .main{grid-template-columns:minmax(0,clamp(300px,44%,520px)) minmax(0,1fr);}

  /* header: a drag region; the Mac's traffic lights sit over its top-left */
  .top{position:absolute;top:0;left:0;right:0;height:var(--hdr);display:flex;align-items:center;gap:12px;padding:0 16px 0 78px;z-index:5;-webkit-app-region:drag;transition:box-shadow .2s;}
  #app.side-open .top{padding-left:16px;}
  .top.scrolled{box-shadow:inset 0 -1px 0 var(--hair);}
  .top button,.top .brand{-webkit-app-region:no-drag;}
  .grp{display:flex;align-items:center;gap:4px;}
  .trail{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .ib{position:relative;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--t2);transition:background .15s,color .15s;}
  .ib:hover,.ib.on{background:var(--s3);color:var(--t1);}
  .ib:active{background:var(--s4);}
  .ctitle{font-size:13px;line-height:18px;font-weight:600;color:var(--t2);max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .badge{position:absolute;top:-2px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--gold);color:var(--on-gold);font-size:11px;line-height:16px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--bg);}
  .udot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--bg);}
  /* tooltips: the button's name and shortcut */
  [data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--s2);color:var(--t1);font-size:12px;line-height:16px;padding:4px 8px;border-radius:6px;box-shadow:var(--shadow);pointer-events:none;z-index:20;}
  .trail [data-tip]:hover::after,.trail [data-tip]:focus-visible::after{left:auto;right:0;transform:none;}
  .grp [data-tip]:hover::after,.grp [data-tip]:focus-visible::after{top:50%;left:calc(100% + 6px);transform:translateY(-50%);}

  /* the mark: the glowing dot and FLINT, in the header as it has always been */
  .brand{display:flex;align-items:center;gap:11px;margin-right:8px;user-select:none;}
  .brand .sp{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff4cf,#ffb14a 55%,#7a4a10);box-shadow:0 0 16px #ffb14a;}
  .brand .nm{color:var(--gold-hi);letter-spacing:.42em;font:700 18px/1 "SF Mono",ui-monospace,Menlo,monospace;}

  /* the small orb: Flint's glow in the header wherever its stage cannot stand */
  .miniorb{display:none;width:14px;height:14px;border-radius:50%;flex:none;background:radial-gradient(circle at 40% 35%,#fff4cf,#ffb14a 55%,#7a4a10);box-shadow:0 0 14px #ffb14a,0 0 4px #ffd27a;animation:breathe 3s ease-in-out infinite;}
  body.talking .miniorb{animation:breathe .9s ease-in-out infinite;}
  @keyframes breathe{0%,100%{transform:scale(.85);opacity:.8}50%{transform:scale(1.05);opacity:1}}
  @media (max-width:1100px){#app.side-open .miniorb{display:block;}}
  @media (max-width:900px){.main:not(.empty) .miniorb{display:block;}}

  /* ---------- sidebar: past chats ---------- */
  .side{grid-row:1;grid-column:1;background:var(--s0);display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:var(--hdr) 8px 12px;}
  #app:not(.side-open) .side{visibility:hidden;}
  .sidescrim{display:none;position:fixed;inset:0;background:var(--scrim);z-index:24;}
  .search{display:flex;align-items:center;gap:8px;height:32px;margin:0 4px 8px;padding:0 10px;border-radius:8px;background:var(--s2);color:var(--t3);}
  .search svg.i{width:16px;height:16px;}
  .search input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--t1);font-size:13px;}
  .search input::placeholder{color:var(--t3);}
  .threads{flex:1;overflow:auto;min-height:0;}
  .sh{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);padding:16px 12px 8px;}
  .trow{display:block;width:100%;text-align:left;height:32px;line-height:32px;padding:0 12px;border-radius:6px;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;}
  .trow:hover{background:var(--s3);}
  .trow.on{background:var(--s4);}
  .side-empty{color:var(--t3);font-size:12px;line-height:16px;padding:12px;}
  .side-foot{display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border-radius:6px;color:var(--t2);font-size:13px;margin-top:8px;}
  .side-foot:hover{background:var(--s3);color:var(--t1);}
  .side-foot svg.i{width:16px;height:16px;}

  /* ---------- the orb's stage ---------- */
  .stage{position:relative;grid-column:1;min-width:0;min-height:0;}
  #brainwrap{position:absolute;inset:var(--hdr) 0 0 0;}
  #brain{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .think{display:none;}

  /* ---------- chat ---------- */
  .chat{grid-column:2;position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;}
  #transcript{flex:1;overflow:auto;padding:calc(var(--hdr) + 24px) 24px 140px;scroll-padding-bottom:140px;}
  .thread-col{max-width:640px;margin:0 auto;}
  .msg{margin-top:32px;font-size:16px;line-height:24px;}
  .msg:first-child{margin-top:0;}
  .msg.you{display:flex;flex-direction:column;align-items:flex-end;}
  .msg.you+.msg.you{margin-top:8px;}
  .msg.you .body{max-width:70%;background:var(--user);border-radius:20px;padding:10px 16px;white-space:pre-wrap;word-break:break-word;}
  .msg.flint .body{color:var(--t1);word-break:break-word;}
  .msg .body p{margin:0 0 12px;} .msg .body p:last-child{margin-bottom:0;}
  .msg .body b{font-weight:600;color:var(--t1);}
  .msg .body i{font-style:italic;}
  .msg .body code{font:.875em var(--mono);background:var(--code);border-radius:4px;padding:1px 4px;}
  .msg .body pre{background:var(--s1);border:1px solid var(--bd);border-radius:8px;margin:12px 0;overflow:auto;}
  .msg .body pre code{display:block;background:none;padding:12px 16px;font:13px/20px var(--mono);white-space:pre;}
  .msg .meta{display:flex;align-items:center;gap:2px;margin-top:8px;min-height:28px;color:var(--t3);opacity:0;transition:opacity .15s;}
  .msg.flint:last-child .meta,.msg.flint:hover .meta,.msg .meta:focus-within{opacity:1;}
  .msg .meta .ib{width:28px;height:28px;color:var(--t3);}
  .msg .meta .ib svg.i{width:16px;height:16px;}
  .msg .body:has(.thinking)+.meta{visibility:hidden;}
  .tag{font-size:11px;line-height:14px;font-weight:500;color:var(--t3);padding:2px 6px;border-radius:6px;background:var(--s2);margin-left:6px;}
  .thinking{display:inline-flex;align-items:center;gap:10px;color:var(--t3);}
  .thinking i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff4cf,#ffb14a 55%,#7a4a10);box-shadow:0 0 12px #ffb14a;animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(.8);opacity:.7}50%{transform:scale(1);opacity:1}}
  .msg .atts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;justify-content:flex-end;}
  .msg .atts img{max-width:180px;max-height:140px;border-radius:12px;display:block;}

  /* empty state */
  .empty-state{position:absolute;inset:var(--hdr) 0 140px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 32px;text-align:center;pointer-events:none;}
  .empty-state>*{pointer-events:auto;}
  .empty-state h1{font-size:24px;line-height:32px;font-weight:500;letter-spacing:-.01em;color:var(--t1);}
  .starters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
  .starter{height:28px;padding:0 12px;border-radius:14px;background:var(--s2);color:var(--t2);font-weight:500;}
  .starter:hover{background:var(--s3);color:var(--t1);}

  /* composer */
  .dock{position:absolute;left:0;right:0;bottom:0;padding:0 24px 24px;background:linear-gradient(to bottom,transparent,var(--bg) 28px);}
  .dock-col{max-width:640px;margin:0 auto;}
  #attnote{display:none;margin:0 8px 8px;font-size:12px;line-height:16px;color:var(--orange);}
  #chips{display:none;flex-wrap:wrap;gap:6px;margin:0 0 8px;}
  #chips.on{display:flex;}
  .chip{display:flex;align-items:center;gap:6px;max-width:100%;padding:4px 6px 4px 8px;border-radius:8px;background:var(--s2);font-size:12px;color:var(--t1);}
  .chip img{width:22px;height:22px;object-fit:cover;border-radius:4px;flex:none;}
  .chip .ck{flex:none;font-size:11px;font-weight:600;color:var(--t2);}
  .chip .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px;}
  .chip .cs{color:var(--t3);flex:none;}
  .chip button{color:var(--t3);font-size:14px;line-height:1;padding:0 2px;}
  .chip button:hover{color:var(--t1);}
  .composer{display:flex;align-items:center;gap:4px;min-height:52px;padding:0 10px;border-radius:26px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--hair);transition:box-shadow .15s;}
  .composer:focus-within{box-shadow:inset 0 0 0 1px var(--hair2);}
  .composer.drop{box-shadow:inset 0 0 0 1px var(--gold);}
  #input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:16px;line-height:24px;padding:12px 4px;color:var(--t1);}
  #input::placeholder{color:var(--t3);}
  .send{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--s4);color:var(--t1);opacity:.35;transition:opacity .15s,background .15s;}
  .send.live{background:var(--gold);color:var(--on-gold);opacity:1;}
  .send svg.i{width:16px;height:16px;stroke-width:2;}
  #micbtn.rec{background:var(--gold);color:var(--on-gold);animation:micpulse 1s ease-in-out infinite;}
  #micbtn.busy{opacity:.5;}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,.5);}50%{box-shadow:0 0 0 6px rgba(212,175,55,0);}}
  .lopill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 8px;border-radius:12px;background:var(--s3);color:var(--t1);font-size:12px;font-weight:500;flex:none;}
  .lopill svg.i{width:12px;height:12px;stroke-width:2;}

  /* ---------- panels (modal on the Mac, a sheet on the phone) ---------- */
  /* A panel covers the chat side only: --stage-edge is where the orb's stage ends (0 when it is not beside the chat). */
  .overlay{position:fixed;top:0;right:0;bottom:0;left:var(--stage-edge,0px);background:var(--scrim);display:none;align-items:flex-start;justify-content:center;z-index:30;padding:56px 16px;}
  .overlay.open{display:flex;}
  .modal{width:min(640px,100%);max-height:min(720px,calc(100vh - 112px));display:flex;flex-direction:column;background:var(--s1);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;}
  .modal.narrow{width:min(480px,100%);}
  .mh{display:flex;align-items:center;gap:12px;height:56px;padding:0 16px 0 24px;flex:none;}
  .mh h2{flex:1;font-size:20px;line-height:26px;font-weight:600;letter-spacing:-.01em;}
  .xb{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--t2);}
  .xb:hover{background:var(--s3);color:var(--t1);}
  .xb svg.i{width:16px;height:16px;}
  .mb{padding:0 24px 24px;overflow:auto;min-height:0;}
  .mf{display:flex;align-items:center;gap:12px;padding:16px 24px;box-shadow:inset 0 1px 0 var(--s3);flex:none;}
  .mf .note{flex:1;color:var(--t3);}
  .seg{display:inline-flex;background:var(--s2);border-radius:8px;padding:2px;gap:2px;margin-bottom:16px;}
  .seg button{height:24px;border-radius:6px;padding:0 12px;color:var(--t2);font-weight:500;display:inline-flex;align-items:center;gap:6px;}
  .seg button.on{background:var(--s4);color:var(--t1);}
  .seg em{font-style:normal;color:var(--t3);font-variant-numeric:tabular-nums;}
  .gsh{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:24px 0 8px;}
  .mb>.gsh:first-child,#sethealth:empty+.gsh,#sethealth>.gsh:first-child{margin-top:8px;}
  .group{background:var(--s2);border-radius:8px;}
  .row{position:relative;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;}
  .row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--s4);}
  .row.two{min-height:56px;}
  .row .lbl{flex:1;min-width:0;display:flex;flex-direction:column;}
  .row .lbl b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .lbl span{font-size:12px;line-height:16px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .lbl .st{font-size:inherit;line-height:inherit;overflow:visible;}
  .row .val{color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .row svg.i{width:16px;height:16px;color:var(--t2);}
  .row.click{cursor:pointer;} .row.click:hover{background:var(--s3);}
  .st{display:inline-flex;align-items:center;gap:8px;color:var(--t2);white-space:nowrap;}
  .st i{width:8px;height:8px;border-radius:50%;background:var(--t3);flex:none;}
  .st.ok i{background:var(--green);} .st.degraded i{background:var(--orange);} .st.down i{background:var(--red);}
  .st.unknown i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--t3);} .st.off i{background:var(--tdis);}
  .btn{height:28px;border-radius:6px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-weight:500;background:var(--s3);box-shadow:inset 0 0 0 1px var(--bd);color:var(--t1);white-space:nowrap;}
  .btn:hover{background:var(--s4);}
  .btn.pri{background:var(--gold);color:var(--on-gold);box-shadow:none;}
  .btn.pri:hover{background:var(--gold-hi);}
  .ghost{height:28px;border-radius:6px;padding:0 10px;display:inline-flex;align-items:center;gap:4px;color:var(--t2);font-weight:500;white-space:nowrap;}
  .ghost:hover{background:var(--s3);color:var(--t1);}
  .ghost svg.i{width:14px;height:14px;}
  .empty{color:var(--t3);padding:24px 0;text-align:center;}
  .empty b{display:block;color:var(--t1);font-size:15px;line-height:20px;font-weight:600;margin-bottom:4px;}
  .err{color:var(--orange);font-size:12px;line-height:16px;}
  .field{width:100%;height:32px;border-radius:6px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--bd2);border:0;outline:none;padding:0 10px;color:var(--t1);font-size:13px;}
  .field:focus{box-shadow:inset 0 0 0 1px var(--gold);}
  .formrow{display:flex;gap:8px;align-items:center;padding:12px 16px;}
  .toggle{position:relative;width:38px;height:22px;border-radius:11px;background:var(--s4);transition:background .15s;flex:none;}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--t1);transition:transform .15s;}
  .toggle[aria-checked="true"]{background:var(--gold);}
  .toggle[aria-checked="true"]::after{transform:translateX(16px);background:var(--on-gold);}
  .mono{font-family:var(--mono);font-size:12px;}

  /* approvals: cards in words */
  .card{padding:14px 16px;}
  .card.open{background:var(--s3);}
  .card+.card::before{content:"";position:absolute;}
  .ct{display:flex;align-items:center;gap:10px;}
  .ct svg.i{width:16px;height:16px;color:var(--t2);}
  .ct b{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ct small{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums;}
  .ct .sub{display:block;font-size:12px;line-height:16px;color:var(--t3);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .facts{display:grid;grid-template-columns:72px minmax(0,1fr);gap:6px 12px;margin:12px 0 0 26px;}
  .facts dt{font-size:12px;line-height:18px;color:var(--t3);}
  .facts dd{margin:0;font-size:13px;line-height:18px;overflow-wrap:anywhere;}
  .details{margin:10px 0 0 26px;}
  .details pre{font:12px/18px var(--mono);color:var(--t2);white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:6px;padding:10px 12px;margin-top:6px;max-height:240px;overflow:auto;}
  .details p{color:var(--t2);font-size:12px;line-height:18px;margin-top:6px;}
  .cf{display:flex;align-items:center;gap:8px;margin-top:14px;padding-left:16px;}
  .cf .ghost{margin-right:auto;}
  .outside{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--t2);}
  .outside i{width:6px;height:6px;border-radius:50%;background:var(--orange);}
  .res{font-size:12px;line-height:16px;color:var(--t2);margin-top:8px;}
  .res.ok{color:var(--gold);} .res.bad{color:var(--orange);}

  /* a card Flint proposes in chat */
  .propose{margin-top:12px;border-radius:8px;background:var(--s2);padding:14px 16px;font-size:13px;line-height:18px;}
  .propose .pt{font-weight:500;}
  .propose .psub{font-size:12px;line-height:16px;color:var(--t3);margin-top:2px;}
  .propose .pargs{display:none;font:12px/18px var(--mono);color:var(--t2);white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:6px;padding:10px 12px;margin-top:10px;max-height:240px;overflow:auto;}
  .propose.show .pargs{display:block;}
  .propose .prow .ghost{margin-right:auto;}
  .propose .prow{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;}
  .propose .prow button{height:28px;border-radius:6px;padding:0 12px;font-weight:500;}
  .propose .ok{background:var(--gold);color:var(--on-gold);}
  .propose .no{background:var(--s3);box-shadow:inset 0 0 0 1px var(--bd);}
  .propose .res{margin-top:8px;}

  /* activity rows */
  .frow{display:flex;align-items:flex-start;gap:12px;padding:10px 8px;border-radius:8px;min-height:56px;}
  .frow:hover{background:var(--s2);}
  .frow .ud{width:6px;height:6px;border-radius:50%;background:var(--gold);margin-top:6px;flex:none;}
  .frow .ud.read{background:transparent;}
  .frow .fx{flex:1;min-width:0;display:flex;flex-direction:column;}
  .frow .fx b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .frow.read .fx b{color:var(--t2);}
  .frow .fx span{font-size:12px;line-height:16px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .frow .fx .more{white-space:normal;overflow:visible;margin-top:6px;color:var(--t2);display:flex;flex-direction:column;gap:4px;}
  .frow .fx .more>span{white-space:normal;overflow:visible;}
  .frow small{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:1px;}
  .frow .acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
  .frow .acts .ghost.on{color:var(--gold);}
  .frow .fsh{margin:16px 0 4px 8px;}

  /* ---------- narrower windows and the phone ---------- */
  @media (max-width:1100px){#app.side-open .main{grid-template-columns:0 minmax(0,1fr);} #app.side-open .stage{display:none;}}
  @media (max-width:900px){
    .main{grid-template-columns:0 minmax(0,1fr);} .stage{display:none;}
    .main.empty .stage{display:block;position:absolute;inset:var(--hdr) 0 auto 0;height:38vh;z-index:0;}
    .main.empty .empty-state{inset:calc(var(--hdr) + 38vh) 0 140px 0;justify-content:flex-start;}
    .main.empty .stage #brainwrap{inset:0;}
    body.panel-open .stage{visibility:hidden;}
    .brand{display:none;}
  }
  @media (max-width:600px){
    :root{--hdr:calc(44px + env(safe-area-inset-top,0px));}
    html,body{font-size:15px;line-height:20px;}
    .top{padding:env(safe-area-inset-top,0px) 4px 0;}
    .ib{width:44px;height:44px;} svg.i{width:22px;height:22px;}
    .ctitle{font-size:15px;}
    #app.side-open{grid-template-columns:0 minmax(0,1fr);}
    #app.side-open .side{position:fixed;inset:0 auto 0 0;width:min(84vw,320px);z-index:25;box-shadow:var(--shadow);padding-top:calc(env(safe-area-inset-top,0px) + 12px);}
    #app.side-open .sidescrim{display:block;}
    .trow{height:44px;line-height:44px;font-size:17px;} .search{height:40px;} .search input,.field{font-size:16px;}
    .seg button{height:36px;} .xb{width:44px;height:44px;} .starter{height:36px;padding:0 14px;}
    .mb{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));}
    #transcript{padding:calc(var(--hdr) + 16px) 16px 150px;}
    .msg{font-size:17px;line-height:24px;}
    .dock{padding:0 16px calc(12px + env(safe-area-inset-bottom,0px));}
    #input{font-size:17px;}
    .overlay{align-items:flex-end;padding:0;}
    .modal,.modal.narrow{width:100%;max-height:88vh;border-radius:16px 16px 0 0;padding-top:8px;}
    .modal::before{content:"";display:block;width:36px;height:5px;border-radius:3px;background:var(--bd2);margin:0 auto 4px;}
    .mh h2{font-size:22px;line-height:28px;}
    .mb{padding:0 16px 16px;} .mf{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));}
    .mf .btn.pri{flex:1;height:50px;border-radius:12px;font-size:17px;justify-content:center;}
    .row{min-height:48px;font-size:17px;} .btn,.ghost{height:44px;}
    .cf{flex-wrap:wrap;padding-left:0;} .cf .ghost{flex-basis:100%;margin-right:0;justify-content:flex-start;padding-left:26px;} .cf .btn{flex:1;justify-content:center;height:44px;}
    .facts{grid-template-columns:72px minmax(0,1fr);}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>

<script>
/* ---------- config ---------- */
// Same-origin by default (the app is served BY Flint). The server injects the token
// for this Mac and for your own tailnet login; a token it injects is current, so it
// wins over a stored one (a rotated token used to lose to the stale stored copy
// forever) and is stored. Elsewhere, paste the token in Settings.
var BASE = localStorage.getItem('flint_url') || '';
var TOKEN = window.__FLINT_TOKEN__ || localStorage.getItem('flint_token') || '';
if (window.__FLINT_TOKEN__) localStorage.setItem('flint_token', window.__FLINT_TOKEN__);
/* A token the server rejects is forgotten, so Settings asks for the current one. */
function tokenRejected(){localStorage.removeItem('flint_token');TOKEN='';openSettings();}
function saveToken(){var el=document.getElementById('tokin');var v=(el.value||'').trim();if(!v)return;localStorage.setItem('flint_token',v);TOKEN=v;el.value='';closeSettings();refresh();loadThreads();pollApprovals();pollNotifs();}
function auth(){return TOKEN?{'Authorization':'Bearer '+TOKEN}:{};}
/* This Mac (and Will's tailnet devices) are signed in by the server; elsewhere the token is pasted once. */
function syncAccess(){$('tokrow-signed').hidden=!TOKEN;$('tokrow-paste').hidden=!!TOKEN&&!!window.__FLINT_TOKEN__;}
var convId = 'console';
function $(id){return document.getElementById(id);}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined&&text!==null)e.textContent=String(text);return e;}
function svgi(name){var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','i');var u=document.createElementNS('http://www.w3.org/2000/svg','use');u.setAttribute('href','#i-'+name);s.appendChild(u);return s;}

/* ---------- the window: sidebar, title, empty state, panels ---------- */
var SIDE_KEY='flint_side';
function sideWanted(){if(window.innerWidth<=600)return false;try{var v=localStorage.getItem(SIDE_KEY);if(v==='1')return true;if(v==='0')return false;}catch(e){}return window.innerWidth>=1100;}
function setSidebar(open,keep){$('app').classList.toggle('side-open',open);$('sidebtn').classList.toggle('on',open);if(typeof syncStageEdge==='function')syncStageEdge();if(keep&&window.innerWidth>600){try{localStorage.setItem(SIDE_KEY,open?'1':'0');}catch(e){}}}
/* Only Will's own toggles are remembered; until then it follows the window's width. */
function toggleSidebar(){setSidebar(!$('app').classList.contains('side-open'),true);}
setSidebar(sideWanted());
function setTitle(t){$('ctitle').textContent=t||'';}
/* The empty state (orb, greeting, starters) shows until the first message. */
function syncEmpty(){var empty=!$('thread').children.length;$('main').classList.toggle('empty',empty);$('emptystate').hidden=!empty;$('input').placeholder=empty?'Ask Flint':'Reply';}
function newChat(){
  stopSpeech();
  convId = 'c' + Date.now();
  $('thread').textContent='';setTitle('');markThread(null);syncEmpty();
  var inp = $('input'); inp.value = ''; syncSend(); inp.focus();
}
var PANELS=['approvals','settings','activity'];
function panelOpen(){return PANELS.some(function(id){return $(id).classList.contains('open');});}
function showPanel(id,on){if(on)PANELS.forEach(function(p){if(p!==id)$(p).classList.remove('open');});$(id).classList.toggle('open',!!on);document.body.classList.toggle('panel-open',panelOpen());syncStageEdge();}
/* Where the orb's stage ends, when it stands beside the chat: panels open to its right and never cover it. */
function stageBeside(){var st=$('stage');if(!st||window.innerWidth<=900)return 0;var r=st.getBoundingClientRect();return r.width>0&&getComputedStyle(st).display!=='none'?Math.round(r.right):0;}
function syncStageEdge(){document.documentElement.style.setProperty('--stage-edge',stageBeside()+'px');}
window.addEventListener('resize',syncStageEdge);
function openSettings(){showPanel('settings',true);loadCreds();loadHealth();refresh();syncAccess();}
function closeSettings(){showPanel('settings',false);}
/* The app's menu bar and keyboard shortcuts land here. */
function flintCommand(name){
  if(name==='newChat')newChat();else if(name==='toggleSidebar')toggleSidebar();else if(name==='openSettings')openSettings();
  else if(name==='openApprovals')openApprovals();else if(name==='openActivity')openNotifs();else if(name==='toggleLocalOnly')toggleLO();}
document.addEventListener('keydown',function(e){
  var mod=e.metaKey||e.ctrlKey;
  if(e.key==='Escape'){if(window.innerWidth<=600&&$('app').classList.contains('side-open')){setSidebar(false);return;}if($('approvals').classList.contains('open'))closeApprovals();else if($('activity').classList.contains('open'))closeActivity();else if($('settings').classList.contains('open')&&TOKEN)closeSettings();return;}
  if(!mod)return;
  if(!e.shiftKey&&(e.key==='b'||e.key==='B')){e.preventDefault();toggleSidebar();}
  else if(e.shiftKey&&(e.key==='l'||e.key==='L')){e.preventDefault();toggleLO();}
  else if(!e.shiftKey&&e.key===','){e.preventDefault();openSettings();}
});
/* The header's hairline appears once the conversation scrolls under it. */
$('transcript').addEventListener('scroll',function(){$('top').classList.toggle('scrolled',this.scrollTop>4);});

/* ---------- live data ---------- */
function refresh(){
  fetch(BASE+'/health').then(function(r){return r.json();}).then(function(h){
    var sys=$('systems');sys.textContent='';
    (h.servers||[]).forEach(function(s){var row=el('div','row');var l=el('span','lbl');l.appendChild(el('b',null,sysName(s)));row.appendChild(l);
      var st=el('span','st ok');st.appendChild(el('i'));st.appendChild(document.createTextNode('Connected'));row.appendChild(st);sys.appendChild(row);});
    if(!(h.servers||[]).length){var row=el('div','row');var l=el('span','lbl');l.appendChild(el('b',null,'None Connected'));row.appendChild(l);sys.appendChild(row);}
  }).catch(function(){});
}
function sysName(s){s=String(s||'');return s.replace(/[_-]+/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});}
function md(s){
  s=esc(s);
  s=s.replace(/```[a-zA-Z0-9_+-]*\n?([\s\S]*?)```/g,function(m,c){return '<pre><code>'+c.replace(/\n/g,'\u0000')+'</code></pre>';});
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/__([^_]+)__/g,'<b>$1</b>');
  s=s.replace(/^\s{0,3}#{1,6}\s+(.+)$/gm,'<b>$1</b>');
  s=s.replace(/^\s*[*\-•]\s+/gm,'• ');
  s=s.replace(/\n/g,'<br>').replace(/\u0000/g,'\n');
  return s;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---------- past chats (the sidebar) ---------- */
var THREADS=[],THREAD_ON=null,THREADS_LOADED=false;
function dayGroup(ms){var d=new Date(ms),now=new Date();var start=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(ms>=start)return 'Today';if(ms>=start-86400000)return 'Yesterday';if(ms>=start-6*86400000)return 'Previous 7 Days';return 'Earlier';}

/* ---------- Will's approval key (passkey on the tailnet HTTPS origin) ---------- */
var CREDS=null;
function b64u(buf){var b=new Uint8Array(buf),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}

function passkeysHere(){return !!(window.PublicKeyCredential&&location.protocol==='https:');}
function canPasskey(){return passkeysHere()&&!!CREDS&&CREDS.some(function(c){return c.factor==='webauthn';});}
/* The Mac app's approval key (Secure Enclave: Touch ID, else the Mac password), through its flintApproval bridge. */
var SE_ID=null,SE_METHOD='touchid';
function enclave(){return window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.flintApproval;}
function se(op,args){return enclave().postMessage(Object.assign({op:op},args||{}));}
function seIdOf(pub){return crypto.subtle.digest('SHA-256',unb64u(pub)).then(function(h){return 'se_'+Array.prototype.map.call(new Uint8Array(h),function(b){return ('0'+b.toString(16)).slice(-2);}).join('').slice(0,32);});}
function canEnclave(){return !!enclave()&&!!SE_ID&&!!CREDS&&CREDS.some(function(c){return c.credentialId===SE_ID;});}
function loadEnclave(){if(!enclave())return;se('status').then(function(st){if(st&&st.method)SE_METHOD=st.method;if(!st||!st.hasKey)return null;return se('publicKey').then(function(r){return seIdOf(r.publicKey);});}).then(function(id){SE_ID=id;}).catch(function(){});}
/* The approve button names the method this device will ask for. */
function approveLabel(all){var p=all?'Approve All':'Approve';
  if(typeof canEnclave==='function'&&canEnclave())return p+(SE_METHOD==='touchid'?' with Touch ID':' with Password');
  if(typeof canPasskey==='function'&&canPasskey())return p+(/iPhone|iPad/.test(navigator.userAgent)?' with Face ID':' with Passkey');
  return p;}
/* How an approval ended: done, still approved (a cap was reached, or a runtime job runs it), or failed. Text only, never HTML. */
function resText(r,t,kind){r.style.display='block';r.textContent=t;r.className='res'+(kind?' '+kind:'');}
function showOutcome(d,r,row){var a=(d&&d.action)||{};
  if(d&&d.error&&!d.action){resText(r,d.error,'bad');row.style.opacity=1;return;}
  row.style.display='none';
  if(a.status==='done')resText(r,'Done'+(a.note?': '+a.note:''),'ok');
  else if(a.status==='approved')resText(r,a.note||'Approved, not run yet','ok');
  else resText(r,(a.error||'Failed')+(a.note?': '+a.note:''),'bad');}
function showDecision(d,decision,r,row){if(decision==='reject'){row.style.display='none';resText(r,'Rejected');return;}showOutcome(d,r,row);}
/* An error in Flint's words: a cancelled prompt is "Cancelled", anything else starts with a capital. */
function errText(e){var m=String(e&&e.message||e||'Stopped');if(/^not confirmed$/i.test(m))return 'Cancelled';
  m=m.replace(/\s*\([^)]*\)/g,'').replace(/(^|\s)~?\/[\w.-]+(\/[\w.-]+)+\/?/g,'$1').replace(/\s+([.,:;])/g,'$1').replace(/\s+/g,' ').trim()||'Stopped';
  return m.charAt(0).toUpperCase()+m.slice(1);}
function failed(e,r,row){row.style.opacity=1;resText(r,errText(e),'bad');}
/* Sign a challenge with this device's approval key: the Mac's key (one prompt covers a run of cards for 5 minutes, unless fresh), else a passkey. */
function signWithMyKey(b,reason,fresh){
  if(canEnclave())return se('sign',{challenge:b.challenge,reason:reason,fresh:!!fresh}).then(function(sg){return {credentialId:SE_ID,signature:sg.signature};});
  if(!canPasskey())return Promise.reject(new Error('No approval key on this device'));
  var allow=CREDS.filter(function(c){return c.factor==='webauthn';}).map(function(c){return {type:'public-key',id:unb64u(c.credentialId)};});
  return navigator.credentials.get({publicKey:{challenge:unb64u(b.challenge),rpId:location.hostname,allowCredentials:allow,userVerification:'required',timeout:60000}})
    .then(function(a){return {credentialId:b64u(a.rawId),authenticatorData:b64u(a.response.authenticatorData),clientDataJSON:b64u(a.response.clientDataJSON),signature:b64u(a.response.signature)};});}
/* A new key on this device: registered with the code; if a key is already enrolled, one of them (on any device) must approve it. */
function finishEnrolment(b,reg,label){
  if(!b.needsApproval)return postJson('/approvals/enroll/finish',reg);
  return postJson('/approvals/enroll/approve-begin',reg).then(function(ap){
    enrollMsg('Approve "'+label+'" from a device that already has a key. Waiting…');
    var tries=0;
    return new Promise(function(resolve,reject){(function poll(){
      fetch(BASE+'/approvals/enroll/approved?challengeId='+encodeURIComponent(ap.challengeId),{headers:auth()}).then(function(r){return r.json();}).then(function(d){
        if(d.approved)return resolve(postJson('/approvals/enroll/finish',Object.assign({},reg,{approval:{challengeId:ap.challengeId}})));
        if(++tries>90)return reject(new Error('Not approved in time. Start again.'));
        setTimeout(poll,3000);}).catch(reject);})();});});}
function enrollEnclave(){var code=$('enrollcode').value.trim();var label=$('enrolllabel').value.trim()||'Mac';
  postJson('/approvals/enroll/begin',{code:code,label:label}).then(function(b){
    return se('publicKey').then(function(pk){return se('sign',{challenge:b.challenge,reason:'add this Mac as Flint approval key',fresh:true}).then(function(sg){
      var reg={challengeId:b.challengeId,factor:'secure_enclave',publicKey:pk.publicKey,signature:sg.signature};
      return finishEnrolment(b,reg,label).then(function(){return seIdOf(pk.publicKey);});});});
  }).then(function(id){SE_ID=id;$('enrollcode').value='';enrollMsg('Approval key added');loadCreds();}).catch(function(e){enrollMsg(e.message||e,true);});}
/* Replace this Mac's key (lost or unwanted): make a new one (Touch ID or password), then enrol it with a code from `enroll --replace` (or another key's approval). */

      return postJson('/approvals/finish',{challengeId:b.challengeId,credentialId:SE_ID,signature:sg.signature});});
  }).then(function(d){showDecision(d,decision,r,row);return d;}).catch(function(e){failed(e,r,row);throw e;});}

function loadCreds(){if(!TOKEN)return;fetch(BASE+'/approvals/credentials',{headers:auth()}).then(function(r){return r.ok?r.json():null;}).then(function(d){

function enrollMsg(t,bad){t=t?errText(t):'';var m=$('enrollmsg');m.hidden=!t;m.textContent=t;m.style.color=bad?'var(--orange)':'var(--gold)';}
function postJson(path,body){return fetch(BASE+path,{method:'POST',headers:Object.assign({'content-type':'application/json'},auth()),body:JSON.stringify(body)}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d;});});}

    return navigator.credentials.create({publicKey:{challenge:unb64u(b.challenge),rp:{id:b.rp.id,name:'Flint'},user:{id:unb64u(b.user.id),name:'will',displayName:'Will'},

function send(speakBack){
  var sb=speakBack===true;
  var inp=$('input');var msg=inp.value.trim();
  if(ATT_READING){attNote('Still reading an attachment.');return;}
  var atts=PENDING.slice();if(!msg&&!atts.length)return;
  if(!TOKEN){openSettings();return;}
  inp.value='';syncSend();PENDING=[];renderChips();attNote('');
  if(!$('thread').children.length&&msg)setTitle(msg.replace(/\s+/g,' ').slice(0,60));
  var you=addMsg('you');you.textContent=msg;if(atts.length)renderSentAtts(you,atts);
  var body=addMsg('flint');body.innerHTML='<span class="thinking"><i></i>Thinking…</span>';
  var raw='',spoken=0;if(sb)stopSpeech();var vctx={displayed:'',gen:_ttsGen};$('think').textContent='responding';setTalk(1);
  fetch(BASE+'/chat',{method:'POST',headers:Object.assign({'content-type':'application/json'},auth()),body:JSON.stringify({conversationId:convId,message:msg,localOnly:LOCAL_ONLY,attachments:atts.map(function(a){return {name:a.name,type:a.type,data:a.data};})})})
  .then(function(res){
    if(res.status===401){body.textContent='The access token was rejected. Add it in Settings.';$('think').textContent='';setTalk(0);tokenRejected();return;}
    /* Refusals (bad file, too large, Local-only + image) come back as JSON, not a stream. */
    if(!res.ok){return res.json().catch(function(){return {};}).then(function(d){body.textContent="Couldn't send: "+((d&&d.error)||('error '+res.status));$('think').textContent='';setTalk(0);});}
    var reader=res.body.getReader(),dec=new TextDecoder(),buf='';
    function pump(){return reader.read().then(function(r){
      if(r.done){$('think').textContent='';setTalk(0);loadThreads();if(!raw)body.textContent='';if(sb){var tail=raw.slice(spoken);if(tail.trim())speakSynced(tail,body,vctx);}return;}
      buf+=dec.decode(r.value,{stream:true});var parts=buf.split('\n\n');buf=parts.pop();
      parts.forEach(function(p){var m=p.match(/^data: (.*)$/m);if(!m)return;try{var ev=JSON.parse(m[1]);
        if(ev.type==='meta'){setBrainChip(body,ev.brain);}
        if(ev.type==='pending'){renderProposals(ev.actions,body);}
        if(ev.type==='text'){raw+=ev.delta;setTalk(1);
          if(!sb){body.innerHTML=md(raw);$('transcript').scrollTop=9e9;}
          else{var rest=raw.slice(spoken),re=/[.!?](\s|$)/g,mm,last=-1;while((mm=re.exec(rest))){last=mm.index+1;}if(last>0){speakSynced(rest.slice(0,last),body,vctx);spoken+=last;}}}
        if(ev.type==='error'){var em='\n\nStopped: '+(ev.error&&ev.error.kind||ev.error);raw+=em;if(sb){vctx.displayed+=em;body.innerHTML=md(vctx.displayed);}else{body.innerHTML=md(raw);}}
      }catch(e){}});
      return pump();
    });}
    return pump();
  }).catch(function(e){body.textContent="Couldn't reach Flint. Try again.";$('think').textContent='';setTalk(0);});
}

/* ---------- attachments (images, PDFs, text files) ----------
   Mirrors the server's limits so a bad file is caught before upload; the server
   re-checks everything by the file's actual bytes, so this is convenience, not
   the gate. Images and PDFs are read by the frontier brain only. */
var PENDING=[],ATT_READING=0;
var ATT_MAX=5,ATT_TOTAL=24*1048576,ATT_LIM={image:5*1048576,document:20*1048576,text:512*1024};
var IMG_TYPES={'image/png':1,'image/jpeg':1,'image/gif':1,'image/webp':1};
var TEXT_EXT=/\.(txt|md|markdown|csv|tsv|json|jsonl|ndjson|xml|ya?ml|toml|log|ini|conf|env|sql|m?js|cjs|tsx?|jsx|py|rb|go|rs|java|kt|swift|c|h|cpp|hpp|cs|php|sh|zsh|bash|html?|css|tex|srt|vtt|diff|patch)$/i;
function attKind(f){if(IMG_TYPES[f.type])return 'image';if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))return 'document';
  if(/^text\//.test(f.type)||/^application\/(json|xml|x-yaml|yaml|javascript|typescript|x-sh|sql|toml|x-ndjson)$/.test(f.type)||TEXT_EXT.test(f.name))return 'text';return null;}
function escA(s){return esc(s).replace(/"/g,'&quot;');}
function fmtSize(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';}
function attNote(t){var n=document.getElementById('attnote');n.textContent=t||'';n.style.display=t?'block':'none';}
function addFiles(list){
  var files=Array.prototype.slice.call(list||[]);if(!files.length)return;attNote('');
  var total=PENDING.reduce(function(s,a){return s+a.size;},0);
  files.forEach(function(f){
    var kind=attKind(f);
    if(!kind){attNote(f.name+" can't be attached. Use an image, a PDF or a text file.");return;}
    if(PENDING.length>=ATT_MAX){attNote('Up to '+ATT_MAX+' files per message.');return;}
    if(f.size>ATT_LIM[kind]){attNote(f.name+' is over the '+fmtSize(ATT_LIM[kind])+' limit.');return;}
    if(total+f.size>ATT_TOTAL){attNote('Attachments total over '+fmtSize(ATT_TOTAL)+'.');return;}
    total+=f.size;
    var a={name:f.name||('pasted.'+(f.type.split('/')[1]||'bin')),type:f.type,size:f.size,kind:kind,data:null,url:null};

/* ---------- voice (speak to Flint, Flint speaks back) ---------- */
var mediaRec=null,voChunks=[],_flintVoice=null;
function pickVoice(){
  if(_flintVoice)return _flintVoice;
  var vs=(window.speechSynthesis&&window.speechSynthesis.getVoices())||[];
  var prefer=['Aaron','Daniel','Fred','Alex','Tom','Oliver','Arthur','Reed','Gordon','Rishi'];
  for(var i=0;i<prefer.length;i++)for(var j=0;j<vs.length;j++)if(vs[j].name.indexOf(prefer[i])>=0){_flintVoice=vs[j];return _flintVoice;}
  for(var k=0;k<vs.length;k++)if(/^en/i.test(vs[k].lang)&&/male|man/i.test(vs[k].name)){_flintVoice=vs[k];return _flintVoice;}
  for(var l=0;l<vs.length;l++)if(/^en/i.test(vs[l].lang)){_flintVoice=vs[l];return _flintVoice;}
  return null;
}
if(window.speechSynthesis)window.speechSynthesis.onvoiceschanged=function(){_flintVoice=null;pickVoice();};
// Speech output: prefer the server's neural voice (human); fall back to the
// local browser voice. Sentences are chained so they always play in order.
var _ttsChain=Promise.resolve(),_ttsGen=0,_ttsAudio=null,_ttsQueued=0;/* sentences of this generation not yet spoken (update-js: not quiet) */
function stopSpeech(){_ttsGen++;_ttsQueued=0;_ttsChain=Promise.resolve();try{if(_ttsAudio){_ttsAudio.pause();_ttsAudio=null;}}catch(e){}try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(e){}}

// A 503 (no TTS key, or OpenAI's spend cap reached) means the browser voice for a while:
// skip the neural request for 10 minutes instead of asking again every sentence.
var _ttsSkipUntil=0;
function _neuralFetch(clean){if(Date.now()<_ttsSkipUntil)return Promise.reject(new Error('no-tts'));return fetch(BASE+'/speak',{method:'POST',headers:Object.assign({'content-type':'application/json'},auth()),body:JSON.stringify({text:clean})}).then(function(r){if(r.status===503)_ttsSkipUntil=Date.now()+600000;if(!r.ok)throw new Error('no-tts');return r.blob();});}
// Speak a sentence AND reveal its text in sync — the words appear on screen the
// instant Flint starts saying them. Audio for the next sentence is prefetched
// while the current one plays, so there are no gaps. Sentences play in order.
function speakForVoice(s){
  // The on-screen text keeps symbols (97°F); the SPOKEN text expands them so the
  // voice actually says the words.
  return s.replace(/[*_`#>\[\]]/g,'')
    .replace(/(\d)\s*°\s*F\b/g,'$1 degrees Fahrenheit')
    .replace(/(\d)\s*°\s*C\b/g,'$1 degrees Celsius')
    .replace(/°/g,' degrees')
    .replace(/\bmph\b/gi,' miles per hour')
    .replace(/(\d)\s*%/g,'$1 percent')
    .replace(/\bRealFeel\b/gi,'real feel')
    .replace(/\s+/g,' ').trim();
}
function speakSynced(sentence,body,vctx){
  var clean=speakForVoice(sentence);
  var reveal=function(){vctx.displayed+=sentence;body.innerHTML=md(vctx.displayed);var tr=document.getElementById('transcript');if(tr)tr.scrollTop=9e9;};
  var blobP=clean?_neuralFetch(clean).catch(function(){return null;}):Promise.resolve(null); // fetch NOW (parallel prefetch)
  var g=vctx.gen;if(g===_ttsGen)_ttsQueued++;var spoken=function(){if(g===_ttsGen&&_ttsQueued>0)_ttsQueued--;};
  _ttsChain=_ttsChain.then(function(){
    if(vctx.gen!==_ttsGen)return;
    return blobP.then(function(blob){
      return new Promise(function(res){
        if(vctx.gen!==_ttsGen){res();return;}
        if(blob){
          var url=URL.createObjectURL(blob);var a=new Audio(url);_ttsAudio=a;
          a.onplay=reveal; // text shows up exactly as the voice begins it
          a.onended=a.onerror=function(){URL.revokeObjectURL(url);if(_ttsAudio===a)_ttsAudio=null;res();};
          a.play().catch(function(){reveal();res();});
        }else{reveal();_localSpeak(clean).then(res);} // no neural voice → local, still synced
      });
    });
  }).then(spoken,spoken);
}
function toggleMic(){
  var btn=document.getElementById('micbtn');
  if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return;}
  /* Said under the input bar, not with alert(): the Mac app's web view shows no dialogs. */
  if(!navigator.mediaDevices||!window.MediaRecorder){attNote("Voice isn't available here.");return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    voChunks=[];try{mediaRec=new MediaRecorder(stream);}catch(e){mediaRec=new MediaRecorder(stream,{mimeType:'audio/mp4'});}
    btn.classList.add('rec');
    mediaRec.ondataavailable=function(e){if(e.data&&e.data.size)voChunks.push(e.data);};
    mediaRec.onstop=function(){
      btn.classList.remove('rec');stream.getTracks().forEach(function(t){t.stop();});
      if(!voChunks.length)return;
      var blob=new Blob(voChunks,{type:voChunks[0].type||'audio/mp4'});
      btn.classList.add('busy');
      fetch(BASE+'/transcribe',{method:'POST',headers:auth(),body:blob}).then(function(r){return r.json();}).then(function(d){
        btn.classList.remove('busy');
        if(d&&d.text){document.getElementById('input').value=d.text;send(true);}
      }).catch(function(){btn.classList.remove('busy');});
    };
    mediaRec.start();
  }).catch(function(e){attNote('Voice needs microphone access.');});
}

/* ---------- the brain (approved viz) ----------
   Flint's orb, unchanged: ~520 particles with their neighbour lines, the warm glow and core.
   It fills its own stage beside the chat, below the header: no text is ever drawn over it
   (panels open to its right; on a narrow window it steps away while a panel is open, and
   rests then). One still frame under Reduce Motion. */
var talkTarget=0,talkNow=0;function setTalk(v){talkTarget=v;document.body.classList.toggle('talking',!!v);}
(function(){

  // underneath shrinks the brain area; without this the viz gets clipped.
  if(window.ResizeObserver){new ResizeObserver(function(){size();}).observe(cvs);}
  var N=520,P=[];for(var i=0;i<N;i++){var u=Math.random(),v=Math.random(),th=2*Math.PI*u,ph=Math.acos(2*v-1),shell=0.55+Math.random()*0.6;
    P.push({sx:Math.sin(ph)*Math.cos(th),sy:Math.cos(ph),sz:Math.sin(ph)*Math.sin(th),rad:shell,sp:0.4+Math.random()*0.9,ph0:Math.random()*6.28,sz2:0.5+Math.random()*1.4});}

    /* Working: thinking, writing, or still speaking a reply aloud. */
    var speaking=(typeof _ttsAudio!=='undefined'&&!!_ttsAudio)||(typeof _ttsQueued!=='undefined'&&_ttsQueued>0)||(window.speechSynthesis&&speechSynthesis.speaking);

    for(var i=0;i<N;i++){var q=pj[i],p=P[i];var depth=(q.z+1.4)/2.8,rr=(0.9+1.7*depth)*p.sz2*(0.85+amp*0.5),br=0.35+0.65*depth,inner=p.rad<0.8,col=inner?'255,238,170':'255,'+Math.round(150+60*depth)+','+Math.round(40+20*depth);var g=ctx.createRadialGradient(q.X,q.Y,0,q.X,q.Y,rr*3.2);g.addColorStop(0,'rgba('+col+','+br+')');g.addColorStop(1,'rgba('+col+',0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(q.X,q.Y,rr*3.2,0,6.283);ctx.fill();}

<script id="lanes-js">
/* ---------- Activity: notifications, and the lanes (what triage decided, Will's labels and acks);

   Through the server's /notifications, /inbox, /escalations and /runtime/health routes. Everything
   the runtime sends may carry a stranger's words (an issue title, a model's note on it), so it is
   rendered with textContent only, never innerHTML, and marked "Outside Text" where tainted. No
   confirm(), alert() or prompt(): the Mac app's web view has none. A failure is shown in the view;
   it never clears the stored token (the server answers a runtime that refuses its own token with 502). */

function laneAgo(iso){var ms=Date.now()-(typeof iso==='number'?iso:Date.parse(iso));if(!(ms>=0))return '';var m=Math.floor(ms/60000);
  if(m<1)return 'Now';if(m<60)return m+'m';if(m<1440)return Math.floor(m/60)+'h';if(m<2880)return 'Yesterday';

function laneWords(s){return String(s||'').replace(/[_.]+/g,' ').trim();}

    es.status=what==='ack'?'acked':'dismissed';for(var i=0;i<bs.length;i++)bs[i].disabled=false;

<script id="approvals-js">

 * same signed path as a card in chat (approveAction / rejectAction). Approve All

 * its own prompt. Text only: nothing here is HTML. */

function apprWords(s){return String(s||'').replace(/[_.:]+/g,' ').trim().replace(/\b\w/g,function(c){return c.toUpperCase();});}
/* A date-only time (a policy's midnight UTC expiry) is shown as that date, whatever the time zone. */

  if(p.fullName==='policy.change'){var rows=a.rows||[];var pats=rows.map(function(r){return r.pattern;});
    if(pats.length&&pats.every(function(x){return /^(backup\.|restore\.)/.test(x);}))return 'Run Backups on Their Own';
    return 'Let '+n(rows)+' Action'+(n(rows)===1?'':'s')+' Run on Their Own';}

function apprSub(p){var a=p.args||{};

  if(p.fullName==='policy.change'){var rows=a.rows||[];var exp=rows[0]&&rows[0].expiresAt;return exp?'Until '+apprDate(exp):'A signed policy change';}
  if(p.fullName==='world.person.create')return 'From events you accepted';
  if(p.fullName==='triage.rule.create')return a.rule&&a.rule.name?a.rule.name:'A new rule';
  if(APPR_NIGHTLY[p.fullName])return 'Waits for you until it runs on its own';

function apprIcon(p){return p.fullName==='world.source.enable'?'power':(APPR_NIGHTLY[p.fullName]||/^(backup|restore)/.test(String((p.args&&p.args.rows&&p.args.rows[0]&&p.args.rows[0].pattern)||'')))?'db':'bolt';}
function apprFrom(o){o=String(o||'');if(o==='cli'||o==='console')return 'You';if(o.indexOf('runtime:')===0)return 'Flint';if(o.indexOf('chat:')===0)return 'A Chat';return o||'Unknown';}
/* Three facts or fewer. */
function apprFacts(p){var a=p.args||{},f=[];
  if(p.fullName==='policy.change'){var rows=a.rows||[];var exp=rows[0]&&rows[0].expiresAt;if(exp)f.push(['Until',apprDate(exp)]);
    var lim={'backup.local':'Backup 1 a Day','restore.drill':'Restore Test 1 a Week','backup.offsite':'Offsite 1 a Day'};
    var named=rows.map(function(r){return lim[r.pattern]||(apprWords(r.pattern)+(r.dailyCap?' '+r.dailyCap+' a Day':''));});

  else if(p.fullName==='world.source.enable')f.push(['Source',apprWords(a.source)]);

/* Asks on its own, never in Approve All: outside text, or money. */
function apprAlone(p){return !!p.tainted||!!p.destructive||p.sensitivity==='financial'||/spend|pay|purchase|transfer|invoice|charge|money|send|delete|remove/i.test(String(p.fullName||''));}
function apprAge(t){return typeof laneAgo==='function'?laneAgo(t):'';}

function apprCard(p){var open=APPR.open===p.id;var card=apprEl('div','card row'+(open?' open':''));card.style.display='block';
  var ct=apprEl('div','ct');ct.appendChild(svgi(apprIcon(p)));var tt=apprEl('b');tt.appendChild(document.createTextNode(apprTitle(p)));

  if(apprAlone(p)){var o=apprEl('span','outside');o.appendChild(apprEl('i'));o.appendChild(document.createTextNode(p.tainted?'Outside Text':p.destructive?'Can’t Be Undone':'Asks on Its Own'));ct.appendChild(o);}

/* Approved but not run (a cap, or the runtime did not answer): run it now. */
function apprWaitingCard(p){var card=apprEl('div','card row');card.style.display='block';var ct=apprEl('div','ct');ct.appendChild(svgi(apprIcon(p)));
  var tt=apprEl('b');tt.appendChild(document.createTextNode(apprTitle(p)));tt.appendChild(apprEl('span','sub','Approved, not run yet'));ct.appendChild(tt);
  var row=apprEl('div','prow');var go=apprEl('button','btn','Run Now');row.appendChild(go);ct.appendChild(row);card.appendChild(ct);
  var res=apprEl('div','res');res.style.display='none';card.appendChild(res);
  go.onclick=function(){go.disabled=true;postJson('/proposals/run',{id:p.id}).then(function(d){showOutcome(d,res,row);}).catch(function(e){failed(e,res,row);});};

function apprHelp(text){var h=document.getElementById('apprhelp');h.textContent=text||'';h.hidden=!text;}
function apprShow(tab){APPR.tab=tab;apprRender();}
function apprRender(){var list=document.getElementById('apprlist');list.textContent='';
  var seg=document.getElementById('apprseg');seg.hidden=!APPR.approved.length;
  document.getElementById('apprtab-waiting').classList.toggle('on',APPR.tab==='waiting');document.getElementById('apprtab-approved').classList.toggle('on',APPR.tab==='approved');
  document.getElementById('apprn-waiting').textContent=APPR.pending.length||'';document.getElementById('apprn-approved').textContent=APPR.approved.length||'';

  if(!APPR.pending.length){var e=apprEl('div','empty');e.appendChild(apprEl('b',null,'Nothing Waiting'));list.appendChild(e);foot.hidden=true;return;}
  if(!APPR.open||!APPR.pending.some(function(p){return p.id===APPR.open;}))APPR.open=APPR.pending[0].id;
  var g2=apprEl('div','group');APPR.pending.forEach(function(p){g2.appendChild(apprCard(p));});list.appendChild(g2);
  var all=APPR.pending.filter(function(p){return !apprAlone(p);}),alone=APPR.pending.length-all.length;
  foot.hidden=false;var btn=document.getElementById('apprall');var note=document.getElementById('apprnote');
  if(APPR.signed&&!APPR.keyed){note.textContent='Add an approval key to approve';btn.textContent='Open Settings';btn.onclick=function(){closeApprovals();openSettings();};btn.disabled=false;return;}
  btn.onclick=approveAll;btn.disabled=APPR.busy||!all.length;btn.textContent=approveLabel(true);

function loadApprovals(){
  fetch(BASE+'/proposals',{headers:auth()}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(!d){APPR.pending=[];APPR.approved=[];apprHelp('');document.getElementById('apprlist').textContent='';var e=apprEl('div','empty');e.appendChild(apprEl('b',null,"Couldn't Load Approvals"));
      var again=apprEl('button','ghost','Try Again');again.onclick=loadApprovals;e.appendChild(again);document.getElementById('apprlist').appendChild(e);document.getElementById('apprfoot').hidden=true;return;}
    var ps=d.proposals||[];APPR.pending=ps.filter(function(p){return p.status==='pending';});APPR.approved=ps.filter(function(p){return p.status==='approved';});
    APPR.signed=!!d.signed;APPR.keyed=(typeof canEnclave==='function'&&canEnclave())||(typeof canPasskey==='function'&&canPasskey());

/* One prompt, then each card signed and finished in turn; the server verifies each. */

<script id="update-js">
/* Flint updates itself. A deploy replaces this page (and the Mac app's build). The
   server stamps the page's version into it (__FLINT_UI__) and answers GET /ui-version
   with the deployed one; once they differ, the page reloads at the first quiet moment:
   nothing typed or attached, no panel open, no reply, recording, transcription, speech
   or approval in progress, no file being chosen, and the page hidden or untouched for a
   minute. The open conversation (and Local only, if on) survives the reload, and a
   restart of the Mac app (localStorage, kept 30 minutes; never reloaded when it cannot
   be kept). The Mac app asks flintIdle() the
   same before restarting onto a new build, and restarts only if flintSnapshot() kept it. */
var UI_VERSION=window.__FLINT_UI__||null,UPDATE_READY=false,LAST_INPUT=Date.now(),FILE_PICKING=0;
(function(){var fp=document.getElementById('filepick');if(fp&&fp.addEventListener){['change','cancel'].forEach(function(t){fp.addEventListener(t,function(){FILE_PICKING=0;});});}})();
['keydown','pointerdown','wheel','touchstart'].forEach(function(t){document.addEventListener(t,function(){LAST_INPUT=Date.now();},true);});
function flintBusy(){
  var inp=document.getElementById('input');if(inp&&inp.value.trim())return true;
  if((typeof PENDING!=='undefined'&&PENDING.length)||(typeof ATT_READING!=='undefined'&&ATT_READING))return true;
  var th=document.getElementById('think');if(th&&th.textContent)return true;
  if(typeof mediaRec!=='undefined'&&mediaRec&&mediaRec.state==='recording')return true;
  var mb=document.getElementById('micbtn');if(mb&&mb.classList&&(mb.classList.contains('busy')||mb.classList.contains('rec')))return true;
  if(typeof _ttsAudio!=='undefined'&&_ttsAudio)return true;
  if(window.speechSynthesis&&(speechSynthesis.speaking||speechSynthesis.pending))return true;
  if(typeof _ttsQueued!=='undefined'&&_ttsQueued>0)return true;
  if(FILE_PICKING&&Date.now()-FILE_PICKING<10*60000)return true;
  /* An approval being signed: its card's buttons dim until the outcome. */
  var t=document.getElementById('transcript'),rows=t&&t.querySelectorAll?t.querySelectorAll('.propose .prow'):[];
  for(var i=0;i<rows.length;i++){if(rows[i].style.display!=='none'&&String(rows[i].style.opacity)==='0.5')return true;}
  return ['settings','activity','approvals'].some(function(id){var e=document.getElementById(id);return !!(e&&e.classList&&e.classList.contains('open'));});
}
function flintIdle(quietMs){return !flintBusy()&&(document.hidden||Date.now()-LAST_INPUT>=(quietMs==null?60000:quietMs));}
/* Keep the open conversation for the next page; false when it cannot be kept. */
function flintSnapshot(){
  var t=document.getElementById('transcript'),th=document.getElementById('thread')||t,html=th?th.innerHTML:'';
  var ct=document.getElementById('ctitle');
  var snap={convId:convId,html:html,title:ct?ct.textContent:'',top:t?t.scrollTop:0,end:t?t.scrollHeight-t.scrollTop-t.clientHeight<40:true,lo:typeof LOCAL_ONLY!=='undefined'&&LOCAL_ONLY===true,at:Date.now()};
  try{localStorage.setItem('flint_resume',JSON.stringify(snap));return true;}catch(e){}
  /* Too large (attached photos): keep the words, not the pictures. */
  try{snap.html=html.replace(/<img\b[^>]*>/gi,'<span class="att-gone">[image]</span>');localStorage.setItem('flint_resume',JSON.stringify(snap));return true;}catch(e){}
  return false;
}
function checkUpdate(){
  return fetch(BASE+'/ui-version',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    var v=d&&typeof d.version==='string'?d.version:null;if(!v)return;
    if(!UI_VERSION){UI_VERSION=v;return;}
    if(v!==UI_VERSION)UPDATE_READY=true;
  }).catch(function(){}).then(function(){if(UPDATE_READY&&flintIdle()&&flintSnapshot())location.reload();});
}
(function resume(){var s=null;try{s=JSON.parse(localStorage.getItem('flint_resume')||'null');localStorage.removeItem('flint_resume');}catch(e){}
  if(!s||typeof s.convId!=='string'||typeof s.at!=='number'||Date.now()-s.at>=30*60000)return;
  convId=s.convId;
  /* Local only is per session and starts off; an update is the same session, so it stays on. */
  if(s.lo===true&&typeof LOCAL_ONLY!=='undefined'){LOCAL_ONLY=true;try{localStorage.setItem('flint_lo','1');}catch(e){}if(typeof applyLO==='function')applyLO();}
  var t=document.getElementById('transcript');if(!t||typeof s.html!=='string')return;
  /* Into the thread (the scroller around it stays). A snapshot an older page took held its whole
     transcript: its "You"/"Flint" labels are dropped, and nothing else of its markup changes. */
  var th=document.getElementById('thread')||t;th.innerHTML=s.html;
  if(th.querySelectorAll)Array.prototype.forEach.call(th.querySelectorAll('.msg>.who'),function(w){if(w.remove)w.remove();});
  var ct=document.getElementById('ctitle');if(ct&&typeof s.title==='string')ct.textContent=s.title;
  if(typeof syncEmpty==='function')syncEmpty();if(typeof markThread==='function')markThread(convId);
  /* A card still waiting lost its buttons' handlers with the page: decide it in Approvals. */
  var rows=th.querySelectorAll?th.querySelectorAll('.propose .prow'):[];
  for(var i=0;i<rows.length;i++){if(rows[i].style.display==='none')continue;rows[i].textContent='';rows[i].style.opacity=1;
    var b=document.createElement('button');b.className='ok';b.textContent='Open Approvals';b.onclick=function(){openApprovals();};if(rows[i].style)rows[i].style.display='flex';rows[i].appendChild(b);}
  t.scrollTop=s.end?t.scrollHeight:(s.top||0);
  /* At the end: stay there once restored pictures have their height. */
  if(s.end){var imgs=t.querySelectorAll?t.querySelectorAll('img'):[];for(var j=0;j<imgs.length;j++){if(!imgs[j].complete&&imgs[j].addEventListener)imgs[j].addEventListener('load',function(){t.scrollTop=t.scrollHeight;});}}})();
setInterval(checkUpdate,60000);
document.addEventListener('visibilitychange',function(){if(document.hidden)checkUpdate();});
</script>
